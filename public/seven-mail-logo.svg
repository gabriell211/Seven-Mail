<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">Seven Mail</title>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#082d9e"/>
      <stop offset=".48" stop-color="#034be8"/>
      <stop offset="1" stop-color="#1231c8"/>
    </linearGradient>
    <linearGradient id="flap" x1=".08" y1=".08" x2=".9" y2=".9">
      <stop offset="0" stop-color="#2fe9ed"/>
      <stop offset=".4" stop-color="#08a8f4"/>
      <stop offset=".76" stop-color="#075ff2"/>
      <stop offset="1" stop-color="#113fd5"/>
    </linearGradient>
    <linearGradient id="leftPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c7cf7"/>
      <stop offset=".6" stop-color="#0649d4"/>
      <stop offset="1" stop-color="#082a94"/>
    </linearGradient>
    <linearGradient id="rightPanel" x1=".15" y1=".15" x2=".92" y2=".95">
      <stop offset="0" stop-color="#7055ff"/>
      <stop offset=".4" stop-color="#563df4"/>
      <stop offset=".78" stop-color="#2840ec"/>
      <stop offset="1" stop-color="#0b38cc"/>
    </linearGradient>
    <linearGradient id="sevenTop" x1="0" y1=".2" x2="1" y2=".8">
      <stop offset="0" stop-color="#35edf0"/>
      <stop offset=".45" stop-color="#0abcf5"/>
      <stop offset="1" stop-color="#0660ef"/>
    </linearGradient>
    <linearGradient id="sevenStroke" x1=".72" y1=".04" x2=".25" y2=".95">
      <stop offset="0" stop-color="#33e9ee"/>
      <stop offset=".38" stop-color="#14b8f3"/>
      <stop offset=".66" stop-color="#4f62f5"/>
      <stop offset=".9" stop-color="#ba55f5"/>
      <stop offset="1" stop-color="#e07af3"/>
    </linearGradient>
    <radialGradient id="shine" cx=".18" cy=".04" r=".86">
      <stop offset="0" stop-color="#fff" stop-opacity=".30"/>
      <stop offset=".38" stop-color="#fff" stop-opacity=".07"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#06215b" flood-opacity=".22"/>
    </filter>
    <filter id="innerDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#001752" flood-opacity=".30"/>
    </filter>
    <clipPath id="envelopeClip">
      <rect x="36" y="92" width="440" height="328" rx="72"/>
    </clipPath>
  </defs>

  <g filter="url(#softShadow)">
    <g clip-path="url(#envelopeClip)">
      <rect x="36" y="92" width="440" height="328" rx="72" fill="url(#body)"/>
      <path d="M36 335 210 188c24-20 68-20 92 0L476 335v85H36Z" fill="url(#leftPanel)"/>
      <path d="M476 335 302 188c-24-20-68-20-92 0L36 335v85h440Z" fill="url(#rightPanel)" opacity=".86"/>
      <path d="M36 147c0-31 25-55 56-55h328c31 0 56 24 56 55 0 18-8 35-22 46L294 327c-22 19-54 19-76 0L58 193c-14-11-22-28-22-46Z"
            fill="url(#flap)" filter="url(#innerDepth)"/>
      <path d="M36 92h440v328H36Z" fill="url(#shine)" opacity=".6"/>
      <rect x="145" y="166" width="220" height="58" rx="29" fill="url(#sevenTop)"/>
      <path d="M354 196C321 229 291 266 266 305c-27 42-51 82-83 115"
            fill="none" stroke="url(#sevenStroke)" stroke-width="72" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M147 180c11-10 22-14 39-14h170c-12 13-24 25-36 38H184c-14 0-25-7-37-24Z"
            fill="#7df8f0" opacity=".18"/>
    </g>
    <rect x="36.75" y="92.75" width="438.5" height="326.5" rx="71.25"
