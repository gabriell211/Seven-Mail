name: Native keyring lockfile verification
on:
  pull_request:
    paths:
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - '.github/workflows/native-keyring-lock.yml'
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve native keyring feature graph
        working-directory: src-tauri
        run: |
          cargo metadata --format-version 1 > /dev/null
          echo 'BEGIN_SEVEN_MAIL_NATIVE_LOCK'
          cat Cargo.lock
          echo 'END_SEVEN_MAIL_NATIVE_LOCK'
      - uses: actions/upload-artifact@v4
        with:
          name: native-keyring-cargo-lock
          path: src-tauri/Cargo.lock
          if-no-files-found: error
