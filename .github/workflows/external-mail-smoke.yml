# Manual smoke trigger
name: External Mail Smoke

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/external-mail-smoke.yml"
      - "src-tauri/src/protocol_e2e.rs"
      - "src-tauri/src/imap_sync.rs"
      - "src-tauri/src/pop3_sync.rs"
      - "src-tauri/src/app_lock.rs"
      - "src-tauri/src/credentials.rs"
      - "src-tauri/src/local_crypto.rs"

# Serialize access to the shared test mailbox (including manual runs).
concurrency:
  group: seven-mail-external-mailbox
  cancel-in-progress: false

jobs:
  external-smtp:
    runs-on: ubuntu-22.04
    env:
      SEVEN_MAIL_EXTERNAL_EMAIL: ${{ secrets.SEVEN_MAIL_EXTERNAL_EMAIL }}
      SEVEN_MAIL_EXTERNAL_USERNAME: ${{ secrets.SEVEN_MAIL_EXTERNAL_EMAIL }}
      SEVEN_MAIL_EXTERNAL_SMTP_HOST: smtp.gmail.com
      SEVEN_MAIL_EXTERNAL_SMTP_PORT: "465"
      SEVEN_MAIL_EXTERNAL_SMTP_SECURITY: tls
      SEVEN_MAIL_TEST_SECRET: ${{ secrets.SEVEN_MAIL_GMAIL_APP_PASSWORD }}
      SEVEN_MAIL_EXTERNAL_RECIPIENT: roval90075@hiredify.com
      SEVEN_MAIL_PROTOCOL_E2E: "1"
      XDG_DATA_HOME: /tmp/seven-mail-external-smoke
    steps:
      - uses: actions/checkout@v6

      - name: Check external mail credentials
        id: credentials
        shell: bash
        run: |
          missing=0
          for name in SEVEN_MAIL_EXTERNAL_EMAIL SEVEN_MAIL_TEST_SECRET
          do
            if [ -z "${!name}" ]; then
              echo "::notice title=Seven Mail external smoke::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done

          if [ "$missing" -eq 1 ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Seven Mail external smoke::External SMTP test was not executed because credentials are not configured."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Tauri and Secret Service dependencies
        if: steps.credentials.outputs.configured == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev dbus-x11 gnome-keyring

      - uses: actions/setup-node@v6
        if: steps.credentials.outputs.configured == 'true'
        with:
          node-version: 24

      - name: Install frontend dependencies
        if: steps.credentials.outputs.configured == 'true'
        run: npm ci

      - name: Generate Tauri assets
        if: steps.credentials.outputs.configured == 'true'
        run: npm run icons

      - uses: dtolnay/rust-toolchain@stable
        if: steps.credentials.outputs.configured == 'true'

      - uses: swatinem/rust-cache@v2
        if: steps.credentials.outputs.configured == 'true'
        with:
          workspaces: "./src-tauri -> target"

      - name: Exercise external SMTP, outbox/Sent and IMAP/POP3 in an isolated native vault
        if: steps.credentials.outputs.configured == 'true'
        env:
          SEVEN_MAIL_EXTERNAL_SMOKE: "1"
        shell: bash
        run: |
          set -euo pipefail
          # Keep the installed toolchain while isolating the test's vault and cache.
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          export HOME="$(mktemp -d)"
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          export XDG_DATA_HOME="$HOME/.local/share"
          export XDG_CONFIG_HOME="$HOME/.config"
          chmod 700 "$HOME" "$XDG_RUNTIME_DIR"
          trap 'rm -rf "$HOME" "$XDG_RUNTIME_DIR"' EXIT

          # The native PIN guard queries Secret Service even when no PIN is set.
          # Run every smoke test in the same unlocked, disposable D-Bus session.
          dbus-run-session -- bash -euo pipefail -c '
            eval "$(printf %s seven-mail-ci-only | gnome-keyring-daemon --unlock --components=secrets)"
            cargo test --locked --manifest-path src-tauri/Cargo.toml --lib credentials::native_backend_tests::native_backend_roundtrip -- --ignored --exact
            cargo test --locked --manifest-path src-tauri/Cargo.toml --lib protocol_e2e::external_smtp_smoke -- --nocapture
            cargo test --locked --manifest-path src-tauri/Cargo.toml --lib protocol_e2e::external_outbox_sent_smoke -- --nocapture
            cargo test --locked --manifest-path src-tauri/Cargo.toml --lib protocol_e2e::external_receive_smoke -- --nocapture
          '
