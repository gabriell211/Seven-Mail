name: Neon SDK dependency validation
on:
  # The candidate is evaluated separately from committed dependencies.
  # PR execution is necessary while this workflow is not yet on main.
  pull_request:
    paths:
      - '.github/workflows/neon-sdk-validation.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency-validation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        candidate: ['matched-neon-auth-ui']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Resolve candidate in clean dependency tree
        shell: bash
        env:
          CANDIDATE: ${{ matrix.candidate }}
        run: |
          set -euo pipefail
          # auth-ui 0.4.0-beta has an exact auth 0.6.0-beta peer.
          # Do not force auth 0.7 into that contract (upstream issue #274).
          npm view @neondatabase/neon-js@0.8.0-beta dependencies --json > /tmp/neon-sdk.json
          npm view @neondatabase/auth@0.6.0-beta dependencies --json > /tmp/neon-auth.json
          npm view @neondatabase/auth-ui@0.4.0-beta peerDependencies dependencies --json > /tmp/neon-ui.json
          npm view better-auth@1.7.6 dependencies --json > /tmp/better-auth.json
          npm view @better-auth/core@1.7.6 peerDependencies --json > /tmp/better-core.json
          npm view @better-auth/api-key@1.7.6 peerDependencies --json > /tmp/better-api-key.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const read = (file) => JSON.parse(fs.readFileSync(file, 'utf8'));
          const sdk = read('/tmp/neon-sdk.json');
          const auth = read('/tmp/neon-auth.json');
          const ui = read('/tmp/neon-ui.json');
          const better = read('/tmp/better-auth.json');
          const core = read('/tmp/better-core.json');
          const apiKey = read('/tmp/better-api-key.json');
          console.log(JSON.stringify({sdk,auth,ui,better,core,apiKey},null,2));
          if (sdk['@neondatabase/auth'] !== '0.6.0-beta' ||
              ui.peerDependencies?.['@neondatabase/auth'] !== '0.6.0-beta' ||
              auth['@neondatabase/auth-ui'] !== '0.4.0-beta') {
            throw new Error('Published SDK/auth/UI versions do not form the expected compatible set');
          }
          const pkg = read('package.json');
          Object.assign(pkg.dependencies,{
            '@neondatabase/neon-js':'0.8.0-beta',
            react:'19.3.1',
            'react-dom':'19.3.1'
          });
          // Pin the shared peer dependencies to the exact versions declared by
          // the SDK, avoiding npm selecting a newer incompatible peer.
          for (const name of ['better-auth','better-call','@better-auth/core','@better-auth/utils','@better-fetch/fetch']) {
            const version = auth[name] ?? ui.dependencies?.[name] ?? better[name] ?? core[name];
            if (typeof version === 'string' && /^\d+\.\d+\.\d+$/.test(version)) {
              pkg.dependencies[name] = version;
            }
          }
          if (pkg.dependencies['@better-auth/core'] !== '1.7.6' ||
              pkg.dependencies['better-call'] !== '1.4.0' ||
              core['better-call'] !== '1.4.0') {
            throw new Error('Better Auth core and better-call must match their published contract');
          }
          // The UI's api-key dependency is a caret range. Select its matching
          // release rather than allowing a newer patch family to pull another core.
          if (apiKey['@better-auth/core'] !== '^1.7.6' ||
              apiKey['better-call'] !== '1.4.0') {
            throw new Error('API key peer metadata does not match the SDK family');
          }
          pkg.dependencies['@better-auth/api-key'] = '1.7.6';
          // Resolve the compatible exact core within each dependent subtree.
          // The peer range ^1.7.6 permits 1.7.6; a later 1.7.27 requires a
          // different better-call release. Keep strict peer validation enabled.
          pkg.overrides = {
            ...(pkg.overrides ?? {}),
            '@better-auth/passkey@1.7.6': {'@better-auth/core':'1.7.6'},
            '@better-auth/api-key@1.7.6': {'@better-auth/core':'1.7.6'},
            '@daveyplate/better-auth-ui@3.4.0': {'@better-auth/api-key':'1.7.6'}
          };
          fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');
          JS
          rm package-lock.json
          npm install --package-lock-only --strict-peer-deps 2>&1 | tee /tmp/npm-resolution.log
          npm ci --strict-peer-deps 2>&1 | tee /tmp/npm-install.log
          # Collect actual advisories before applying the promotion gates.
          # npm audit exits nonzero for vulnerabilities; preserve its report and status.
          audit_status=0
          npm audit --json > /tmp/neon-audit.json || audit_status=$?
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const report=JSON.parse(fs.readFileSync('/tmp/neon-audit.json','utf8'));
          if (!report.metadata?.vulnerabilities || !report.vulnerabilities) {
            throw new Error('Missing npm audit data; cannot validate dependency security');
          }
          for (const [name, issue] of Object.entries(report.vulnerabilities)) {
            console.log(JSON.stringify({
              name, severity:issue.severity, range:issue.range,
              via:issue.via, effects:issue.effects, fixAvailable:issue.fixAvailable
            }));
          }
          console.log(JSON.stringify(report.metadata.vulnerabilities));
          JS
          dependency_status=0
          npm ls --all > /tmp/neon-dependency-tree.txt 2>&1 || dependency_status=$?
          failed=0
          if grep -Ei 'npm warn|DeprecationWarning' /tmp/npm-resolution.log /tmp/npm-install.log; then
            echo 'Dependency warnings still present; do not promote candidate.'
            failed=1
          fi
          if [ "$audit_status" -ne 0 ] || [ "$dependency_status" -ne 0 ]; then
            echo 'Security audit or dependency tree failed; do not promote candidate.'
            failed=1
          fi
          exit "$failed"
      - name: Upload dependency diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: neon-sdk-diagnostics-${{ matrix.candidate }}
          path: |
            /tmp/neon-audit.json
            /tmp/neon-dependency-tree.txt
            /tmp/npm-resolution.log
            /tmp/npm-install.log
          if-no-files-found: warn
      - run: npm test
      - name: Build candidate and reject frontend warnings
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee /tmp/frontend-build.log
          if grep -Ei '(^|[[:space:]])warning:|\[warn\]|DeprecationWarning|\(!\)' /tmp/frontend-build.log; then
            echo 'Frontend emitted warnings.'
            exit 1
          fi
      - name: Emit validated manifest and lockfile for review
        shell: bash
        run: |
          echo 'BEGIN_SEVEN_MAIL_NPM_MANIFEST'
          cat package.json
          echo 'END_SEVEN_MAIL_NPM_MANIFEST'
          echo 'BEGIN_SEVEN_MAIL_NPM_LOCK'
          cat package-lock.json
          echo 'END_SEVEN_MAIL_NPM_LOCK'
      - uses: actions/upload-artifact@v6
        with:
          name: neon-sdk-validated-lock-${{ matrix.candidate }}
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
