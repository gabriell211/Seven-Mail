name: Neon SDK dependency validation
on:
  pull_request:
    paths:
      - '.github/workflows/neon-sdk-validation.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'src/lib/neon.ts'
permissions:
  contents: read
jobs:
  dependency-validation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        candidate: ['new-sdk-clean']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Resolve candidate in clean dependency tree
        shell: bash
        env:
          CANDIDATE: ${{ matrix.candidate }}
        run: |
          set -euo pipefail
          npm view @neondatabase/neon-js@0.9.0-beta dependencies --json
          if [ "$CANDIDATE" = new-sdk-clean ]; then
            npm pkg set 'dependencies.@neondatabase/neon-js=0.9.0-beta'
            # The actual ERESOLVE report requires React ^19.3.0 through
            # optional Drizzle/React Native peers. Pin both packages exactly.
            REACT_VERSION=19.3.1
            npm view "react@$REACT_VERSION" version
            npm view "react-dom@$REACT_VERSION" version
            npm pkg set "dependencies.react=$REACT_VERSION" "dependencies.react-dom=$REACT_VERSION"
            npm view @neondatabase/auth@0.7.0-beta dependencies peerDependencies --json
          fi
          rm package-lock.json
          npm install --package-lock-only --strict-peer-deps 2>&1 | tee /tmp/npm-resolution.log
          npm ci --strict-peer-deps 2>&1 | tee /tmp/npm-install.log
          if grep -Ei 'npm warn (ERESOLVE|deprecated)|DeprecationWarning' /tmp/npm-resolution.log /tmp/npm-install.log; then
            echo 'Dependency warnings still present; do not promote candidate.'
            exit 1
          fi
          npm ls --all >/dev/null
      - run: npm test
      - run: npm run build
      - name: Emit validated manifest and lockfile for review
        shell: bash
        run: |
          echo 'BEGIN_SEVEN_MAIL_NPM_MANIFEST'
          cat package.json
          echo 'END_SEVEN_MAIL_NPM_MANIFEST'
          echo 'BEGIN_SEVEN_MAIL_NPM_LOCK'
          cat package-lock.json
          echo 'END_SEVEN_MAIL_NPM_LOCK'
      - uses: actions/upload-artifact@v6
        with:
          name: neon-sdk-validated-lock-${{ matrix.candidate }}
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
