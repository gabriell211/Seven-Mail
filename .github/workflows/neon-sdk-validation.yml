name: Neon SDK dependency validation
on:
  # The candidate is evaluated separately from committed dependencies.
  # PR execution is necessary while this workflow is not yet on main.
  pull_request:
    paths:
      - '.github/workflows/neon-sdk-validation.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency-validation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        candidate: ['latest-published']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Resolve candidate in clean dependency tree
        shell: bash
        env:
          CANDIDATE: ${{ matrix.candidate }}
        run: |
          set -euo pipefail
          # The previously tested 0.8 beta resolves peers but carries published
          # Better Auth/Zod advisories. Do not pin those vulnerable versions.
          # The latest SDK must satisfy its own published peer contracts.
          npm view @neondatabase/neon-js@0.9.0-beta dependencies --json > /tmp/neon-sdk.json
          npm view @neondatabase/auth@0.7.0-beta dependencies peerDependencies --json > /tmp/neon-auth.json
          npm view @neondatabase/auth-ui@0.4.0-beta dependencies peerDependencies --json > /tmp/neon-ui.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const read = (file) => JSON.parse(fs.readFileSync(file, 'utf8'));
          console.log(JSON.stringify({
            sdk:read('/tmp/neon-sdk.json'),
            auth:read('/tmp/neon-auth.json'),
            ui:read('/tmp/neon-ui.json')
          },null,2));
          const pkg = read('package.json');
          pkg.dependencies['@neondatabase/neon-js'] = '0.9.0-beta';
          fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');
          JS
          rm package-lock.json
          npm install --package-lock-only --strict-peer-deps 2>&1 | tee /tmp/npm-resolution.log
          npm ci --strict-peer-deps 2>&1 | tee /tmp/npm-install.log
          # Collect actual advisories before applying the promotion gates.
          # npm audit exits nonzero for vulnerabilities; preserve its report and status.
          audit_status=0
          npm audit --json > /tmp/neon-audit.json || audit_status=$?
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const report=JSON.parse(fs.readFileSync('/tmp/neon-audit.json','utf8'));
          if (!report.metadata?.vulnerabilities || !report.vulnerabilities) {
            throw new Error('Missing npm audit data; cannot validate dependency security');
          }
          for (const [name, issue] of Object.entries(report.vulnerabilities)) {
            console.log(JSON.stringify({
              name, severity:issue.severity, range:issue.range,
              via:issue.via, effects:issue.effects, fixAvailable:issue.fixAvailable
            }));
          }
          console.log(JSON.stringify(report.metadata.vulnerabilities));
          JS
          dependency_status=0
          npm ls --all > /tmp/neon-dependency-tree.txt 2>&1 || dependency_status=$?
          failed=0
          if grep -Ei 'npm warn|DeprecationWarning' /tmp/npm-resolution.log /tmp/npm-install.log; then
            echo 'Dependency warnings still present; do not promote candidate.'
            failed=1
          fi
          if [ "$audit_status" -ne 0 ] || [ "$dependency_status" -ne 0 ]; then
            echo 'Security audit or dependency tree failed; do not promote candidate.'
            failed=1
          fi
          exit "$failed"
      - name: Upload dependency diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: neon-sdk-diagnostics-${{ matrix.candidate }}
          path: |
            /tmp/neon-audit.json
            /tmp/neon-dependency-tree.txt
            /tmp/npm-resolution.log
            /tmp/npm-install.log
            /tmp/neon-sdk.json
            /tmp/neon-auth.json
            /tmp/neon-ui.json
          if-no-files-found: warn
      - run: npm test
      - name: Build candidate and reject frontend warnings
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee /tmp/frontend-build.log
          if grep -Ei '(^|[[:space:]])warning:|\[warn\]|DeprecationWarning|\(!\)' /tmp/frontend-build.log; then
            echo 'Frontend emitted warnings.'
            exit 1
          fi
      - name: Emit validated manifest and lockfile for review
        shell: bash
        run: |
          echo 'BEGIN_SEVEN_MAIL_NPM_MANIFEST'
          cat package.json
          echo 'END_SEVEN_MAIL_NPM_MANIFEST'
          echo 'BEGIN_SEVEN_MAIL_NPM_LOCK'
          cat package-lock.json
          echo 'END_SEVEN_MAIL_NPM_LOCK'
      - uses: actions/upload-artifact@v6
        with:
          name: neon-sdk-validated-lock-${{ matrix.candidate }}
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
