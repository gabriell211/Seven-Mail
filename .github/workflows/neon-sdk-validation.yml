name: Neon SDK dependency validation
on:
  pull_request:
    paths:
      - '.github/workflows/neon-sdk-validation.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'src/lib/neon.ts'
      - 'vite.config.ts'
permissions:
  contents: read
jobs:
  dependency-validation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        candidate: ['matched-neon-auth-ui']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Resolve candidate in clean dependency tree
        shell: bash
        env:
          CANDIDATE: ${{ matrix.candidate }}
        run: |
          set -euo pipefail
          # auth-ui 0.4.0-beta has an exact auth 0.6.0-beta peer.
          # Do not force auth 0.7 into that contract (upstream issue #274).
          npm view @neondatabase/neon-js@0.8.0-beta dependencies --json > /tmp/neon-sdk.json
          npm view @neondatabase/auth@0.6.0-beta dependencies --json > /tmp/neon-auth.json
          npm view @neondatabase/auth-ui@0.4.0-beta peerDependencies dependencies --json > /tmp/neon-ui.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const read = (file) => JSON.parse(fs.readFileSync(file, 'utf8'));
          const sdk = read('/tmp/neon-sdk.json');
          const auth = read('/tmp/neon-auth.json');
          const ui = read('/tmp/neon-ui.json');
          console.log(JSON.stringify({sdk,auth,ui},null,2));
          if (sdk['@neondatabase/auth'] !== '0.6.0-beta' ||
              ui.peerDependencies?.['@neondatabase/auth'] !== '0.6.0-beta' ||
              auth['@neondatabase/auth-ui'] !== '0.4.0-beta') {
            throw new Error('Published SDK/auth/UI versions do not form the expected compatible set');
          }
          const pkg = read('package.json');
          Object.assign(pkg.dependencies,{
            '@neondatabase/neon-js':'0.8.0-beta',
            react:'19.3.1',
            'react-dom':'19.3.1'
          });
          // Pin the shared peer dependencies to the exact versions declared by
          // the SDK, avoiding npm selecting a newer incompatible peer.
          for (const name of ['better-auth','better-call','@better-auth/core','@better-auth/utils','@better-fetch/fetch']) {
            const version = auth[name] ?? ui.dependencies?.[name];
            if (typeof version === 'string' && /^\d+\.\d+\.\d+$/.test(version)) {
              pkg.dependencies[name] = version;
            }
          }
          fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');
          JS
          rm package-lock.json
          npm install --package-lock-only --strict-peer-deps 2>&1 | tee /tmp/npm-resolution.log
          npm ci --strict-peer-deps 2>&1 | tee /tmp/npm-install.log
          if grep -Ei 'npm warn (ERESOLVE|deprecated)|DeprecationWarning' /tmp/npm-resolution.log /tmp/npm-install.log; then
            echo 'Dependency warnings still present; do not promote candidate.'
            exit 1
          fi
          npm ls --all >/dev/null
      - run: npm test
      - name: Build candidate and reject frontend warnings
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee /tmp/frontend-build.log
          if grep -Ei '(^|[[:space:]])warning:|\[warn\]|DeprecationWarning|\(!\)' /tmp/frontend-build.log; then
            echo 'Frontend emitted warnings.'
            exit 1
          fi
      - name: Emit validated manifest and lockfile for review
        shell: bash
        run: |
          echo 'BEGIN_SEVEN_MAIL_NPM_MANIFEST'
          cat package.json
          echo 'END_SEVEN_MAIL_NPM_MANIFEST'
          echo 'BEGIN_SEVEN_MAIL_NPM_LOCK'
          cat package-lock.json
          echo 'END_SEVEN_MAIL_NPM_LOCK'
      - uses: actions/upload-artifact@v6
        with:
          name: neon-sdk-validated-lock-${{ matrix.candidate }}
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
