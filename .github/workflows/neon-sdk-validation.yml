name: Neon SDK dependency validation
on:
  pull_request:
    paths:
      - '.github/workflows/neon-sdk-validation.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'src/lib/neon*.ts'
      - 'tests/neon*.test.mts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate committed dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --strict-peer-deps --strict-allow-scripts 2>&1 | tee /tmp/npm-install.log
          npm audit --json > /tmp/neon-audit.json
          npm ls --all > /tmp/neon-dependency-tree.txt
          if grep -Ei 'npm warn|DeprecationWarning' /tmp/npm-install.log; then
            echo 'Dependency warnings present.'
            exit 1
          fi
      - name: Test frontend
        run: npm test
      - name: Build frontend without warnings
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee /tmp/frontend-build.log
          if grep -Ei '(^|[[:space:]])warning:|\[warn\]|DeprecationWarning|\(!\)' /tmp/frontend-build.log; then
            echo 'Frontend emitted warnings.'
            exit 1
          fi
      - name: Upload dependency diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: neon-sdk-diagnostics
          path: |
            /tmp/npm-install.log
            /tmp/neon-audit.json
            /tmp/neon-dependency-tree.txt
            /tmp/frontend-build.log
          if-no-files-found: warn
