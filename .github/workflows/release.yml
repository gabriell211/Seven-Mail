name: Desktop Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/release-trigger"

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows installers
            platform: windows-latest
            bundles: msi,nsis
          - name: Linux installers
            platform: ubuntu-22.04
            bundles: deb,appimage
          - name: macOS installers
            platform: macos-latest
            bundles: app,dmg

    runs-on: ${{ matrix.platform }}
    env:
      RUSTFLAGS: '-D warnings'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install locked dependencies without warnings
        shell: bash
        run: |
          set -euo pipefail
          npm ci --strict-peer-deps --strict-allow-scripts 2>&1 | tee npm-install.log
          if grep -Ei 'npm warn|DeprecationWarning|\[DEP[0-9]+\]' npm-install.log; then
            echo "Dependency installation emitted warnings."
            exit 1
          fi
          npm ls --all >/dev/null
          npm audit --audit-level=low

      - name: Generate native icons
        run: npm run icons

      - name: Validate frontend
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run build 2>&1 | tee frontend-build.log
          if grep -Ei '(^|[[:space:]])warning:|\[warn\]|DeprecationWarning|\(!\)' frontend-build.log; then
            echo "Frontend build emitted warnings."
            exit 1
          fi

      - name: Prepare Windows native dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Install-WithRetry([string] $Package) {
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              choco install $Package -y --no-progress
              if ($LASTEXITCODE -eq 0) { return }
              if ($attempt -lt 3) {
                Write-Host "Retrying $Package after package source failure ($attempt/3)."
                Start-Sleep -Seconds (10 * $attempt)
              }
            }
            throw "Unable to install $Package after three attempts."
          }
          $perl = 'C:\Strawberry\perl\bin\perl.exe'
          if (-not (Test-Path -LiteralPath $perl -PathType Leaf)) {
            Install-WithRetry 'strawberryperl'
          }
          if (-not (Test-Path -LiteralPath $perl -PathType Leaf)) {
            throw 'Native Strawberry Perl executable missing.'
          }
          & $perl -MLocale::Maketext::Simple -MIPC::Cmd -e 'print "Native Perl ready\n"'
          if ($LASTEXITCODE -ne 0) { throw 'Native Perl prerequisites missing.' }

          # Prefer tools already available on the runner; avoid unnecessary feed requests.
          $env:PATH = "$env:PATH;" + [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          $nasm = Get-Command nasm.exe -CommandType Application -ErrorAction SilentlyContinue
          if (-not $nasm) {
            Install-WithRetry 'nasm'
            $env:PATH = "$env:PATH;" + [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
            $nasm = Get-Command nasm.exe -CommandType Application -ErrorAction SilentlyContinue
          }
          if (-not $nasm) { throw 'NASM executable missing after installation.' }
          & $nasm.Source -v
          if ($LASTEXITCODE -ne 0) { throw 'NASM version check failed.' }
          @('C:\Strawberry\perl\bin', 'C:\Strawberry\c\bin', (Split-Path -Parent $nasm.Source)) |
            Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Prepare locked OpenSSL for MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PATH = "C:\Strawberry\perl\bin;C:\Strawberry\c\bin;$env:PATH"
          ./src-tauri/scripts/prepare-msvc-openssl.ps1
          "CARGO_HOME=$env:CARGO_HOME" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Validate Rust
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Validate optional Google OAuth desktop release configuration
        shell: bash
        env:
          SEVEN_MAIL_GEMINI_GOOGLE_CLIENT_ID: ${{ vars.SEVEN_MAIL_GEMINI_GOOGLE_CLIENT_ID }}
          SEVEN_MAIL_GEMINI_GOOGLE_PROJECT: ${{ vars.SEVEN_MAIL_GEMINI_GOOGLE_PROJECT }}
        run: |
          set -euo pipefail
          if [[ -z "$SEVEN_MAIL_GEMINI_GOOGLE_CLIENT_ID" && -z "$SEVEN_MAIL_GEMINI_GOOGLE_PROJECT" ]]; then
            echo "::notice::Using registered Seven Mail public desktop client and project defaults."
            exit 0
          fi
          [[ "$SEVEN_MAIL_GEMINI_GOOGLE_CLIENT_ID" =~ ^[a-zA-Z0-9._-]+\.apps\.googleusercontent\.com$ ]] && [[ ${#SEVEN_MAIL_GEMINI_GOOGLE_CLIENT_ID} -le 256 ]] || { echo "::error::Invalid OAuth desktop client ID."; exit 1; }
          [[ "$SEVEN_MAIL_GEMINI_GOOGLE_PROJECT" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]] || { echo "::error::Invalid Google Cloud project ID."; exit 1; }

      - name: Build installers into a draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEVEN_MAIL_GEMINI_GOOGLE_CLIENT_ID: ${{ vars.SEVEN_MAIL_GEMINI_GOOGLE_CLIENT_ID }}
          SEVEN_MAIL_GEMINI_GOOGLE_PROJECT: ${{ vars.SEVEN_MAIL_GEMINI_GOOGLE_PROJECT }}
          # Optional installed-app value only; never a confidential web-client secret.
          SEVEN_MAIL_GEMINI_GOOGLE_CLIENT_SECRET: ${{ secrets.SEVEN_MAIL_GEMINI_GOOGLE_CLIENT_SECRET }}
          SEVEN_MAIL_ONEDRIVE_CLIENT_ID: ${{ vars.SEVEN_MAIL_ONEDRIVE_CLIENT_ID }}
        with:
          tagName: v__VERSION__
          releaseName: "Seven Mail v__VERSION__"
          releaseBody: |
            Seven Mail v__VERSION__

            Novidades da v1.0.7:
            - Mensagens não lidas com marcador roxo, destaque e contador alinhado ao filtro.
            - Gemini conectado exclusivamente por chave da API, em janela independente; a engrenagem permite trocar a chave.
            - Geração e edição de imagens, criação de assinaturas com prévia e aprovação, documentos Markdown e exportação.
            - Respostas com formatação Markdown básica e suporte a notificações nativas de novos e-mails, tarefas e calendário.
            - Avisos automáticos sem botão de teste, com deduplicação e respeito ao horário silencioso.

            A geração de imagens depende do acesso ao modelo e da cota do projeto Google. A apresentação das notificações depende das configurações do sistema operacional. A homologação prática dessas funcionalidades permanece pendente. A compatibilidade PST ampliada com Outlook está em desenvolvimento e não faz parte desta versão.

            Windows:
            - MSI
            - NSIS (.exe)

            Linux:
            - DEB
            - AppImage

            macOS:
            - APP
            - DMG
          releaseDraft: true
          prerelease: false
          args: --bundles ${{ matrix.bundles }}

  publish-v107:
    name: Publish verified v1.0.7
    needs: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Publish only the requested complete release
        shell: bash
        run: |
          set -euo pipefail
          tag="$(tr -d '\r\n' < .github/release-trigger)"
          if [[ "$tag" != v1.0.7 ]]; then
            echo "Automatic publication is scoped to the requested v1.0.7."
            exit 0
          fi
          version="$(jq -r .version src-tauri/tauri.conf.json)"
          [[ "v$version" == "$tag" ]]
          # Require successful CI on exactly the source revision built above.
          passed=0
          for attempt in $(seq 1 80); do
            ci="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" -f head_sha="$GITHUB_SHA" -f event=push -F per_page=10 | jq -c --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.id) | last // {}')"
            status="$(jq -r '.status // ""' <<< "$ci")"
            conclusion="$(jq -r '.conclusion // ""' <<< "$ci")"
            if [[ "$status" == completed ]]; then
              [[ "$conclusion" == success ]] || { echo "Main CI did not pass; keeping the draft."; exit 1; }
              passed=1
              break
            fi
            sleep 15
          done
          [[ "$passed" == 1 ]] || { echo "Main CI not confirmed; keeping the draft."; exit 1; }
          # Draft remains unpublished unless all six platform assets are present.
          release="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq -sce --arg tag "$tag" '[.[][] | select(.tag_name == $tag)] | if length == 1 then .[0] else error("Release not unique") end')"
          jq -e --arg sha "$GITHUB_SHA" '.target_commitish == $sha and .prerelease == false' <<< "$release" >/dev/null
          for name in "Seven.Mail_${version}_x64-setup.exe" "Seven.Mail_${version}_x64_en-US.msi" "Seven.Mail_${version}_amd64.AppImage" "Seven.Mail_${version}_amd64.deb" "Seven.Mail_${version}_aarch64.dmg" "Seven.Mail_aarch64.app.tar.gz"; do
            jq -e --arg name "$name" '[.assets[] | select(.name == $name and .state == "uploaded" and .size > 0 and ((.digest // "") | test("^sha256:[0-9a-fA-F]{64}$")))] | length == 1' <<< "$release" >/dev/null
          done
          id="$(jq -r .id <<< "$release")"
          if [[ "$(jq -r .draft <<< "$release")" == true ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F draft=false -f make_latest=true --jq '{tag_name,draft,html_url}'
          fi
