name: Desktop Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows installers
            platform: windows-latest
            bundles: msi,nsis
          - name: Linux installers
            platform: ubuntu-22.04
            bundles: deb,appimage

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm install

      - name: Generate native icons
        run: npm run icons

      - name: Validate frontend
        run: npm run build

      - name: Validate Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build and publish installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Seven Mail v__VERSION__"
          releaseBody: |
            Seven Mail 0.4.0 amplia a experiência local-first e a interoperabilidade do cliente desktop.

            Destaques:
            - Nova tela de inicialização premium ligada ao bootstrap real
            - Identidade visual e ícones nativos atualizados
            - Importação de mensagens EML e exportação de mensagens para EML
            - Importação e exportação de calendários ICS
            - Importação e exportação de contatos CSV e vCard
            - Backup e restauração de workspace, preferências e metadados de contas
            - Calendário com visualizações Dia, Semana, Mês e Agenda
            - Lembretes nativos de eventos
            - Tarefas com Hoje, Atrasadas, Próximas e data de início
            - Criação de evento diretamente a partir de um e-mail
            - Atalhos de teclado para navegação e ações de mensagens
            - Edição de categorias

            Instaladores:
            - Windows: MSI e NSIS (.exe)
            - Linux: DEB e AppImage
          releaseDraft: false
          prerelease: false
          args: --bundles ${{ matrix.bundles }}
