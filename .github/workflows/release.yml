name: Desktop Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows installers
            platform: windows-latest
            bundles: msi,nsis
          - name: Linux installers
            platform: ubuntu-22.04
            bundles: deb,appimage
          - name: macOS installers
            platform: macos-latest
            bundles: app,dmg

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm install

      - name: Generate native icons
        run: npm run icons

      - name: Validate frontend
        run: npm run build

      - name: Validate Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build and publish installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Seven Mail v__VERSION__"
          releaseBody: |
            Seven Mail 1.0.0 — primeira versão estável.

            O checklist funcional do README está concluído.

            Destaques:
            - Cliente local-first multi-conta com IMAP/SMTP, POP3, OAuth, CalDAV, CardDAV e LDAP
            - Caixa unificada, conversas, pesquisa avançada, regras, offline e fila durável
            - Calendário, contatos, tarefas, notas, perfis e migração completa
            - EML, MSG, OFT, MBOX, PST, ICS, CSV e vCard
            - S/MIME com assinatura, verificação e criptografia
            - Integrações corporativas condicionais: recall, políticas, sensibilidade, retenção e direitos
            - Reações compatíveis, push quando suportado e notificações acionáveis
            - Atualizador integrado com verificação SHA-256
            - Identidade visual, splash e instaladores nativos

            Windows:
            - MSI
            - NSIS (.exe)

            Linux:
            - DEB
            - AppImage

            macOS:
            - APP
            - DMG
          releaseDraft: false
          prerelease: false
          args: --bundles ${{ matrix.bundles }}
