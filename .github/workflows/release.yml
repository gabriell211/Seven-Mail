name: Desktop Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/release-trigger"

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows installers
            platform: windows-latest
            bundles: msi,nsis
          - name: Linux installers
            platform: ubuntu-22.04
            bundles: deb,appimage
          - name: macOS installers
            platform: macos-latest
            bundles: app,dmg

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm install

      - name: Generate native icons
        run: npm run icons

      - name: Validate frontend
        run: npm run build

      - name: Validate Rust
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Build and publish installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Seven Mail v__VERSION__"
          releaseBody: |
            Seven Mail v__VERSION__

            Principais mudanças:
            - IMAP IDLE contínuo para novos e-mails sem a antiga janela de espera.
            - INBOX monitorada continuamente mesmo enquanto outra pasta está aberta.
            - Pasta ativa atualizada em tempo real quando o servidor suporta IMAP IDLE.
            - POP3 com polling curto e estado real exibido na interface.
            - Enviados atualizado logo após o SMTP aceitar a mensagem.
            - Reconciliação com Gmail/Exchange e fallback IMAP APPEND para servidores genéricos.
            - Interface mostra estados reais de sincronização, SMTP e erros.

            Windows:
            - MSI
            - NSIS (.exe)

            Linux:
            - DEB
            - AppImage

            macOS:
            - APP
            - DMG
          releaseDraft: false
          prerelease: false
          args: --bundles ${{ matrix.bundles }}
