name: Desktop Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/release-trigger"

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows installers
            platform: windows-latest
            bundles: msi,nsis
          - name: Linux installers
            platform: ubuntu-22.04
            bundles: deb,appimage
          - name: macOS installers
            platform: macos-latest
            bundles: app,dmg

    runs-on: ${{ matrix.platform }}
    env:
      RUSTFLAGS: '-D warnings'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install locked dependencies without warnings
        shell: bash
        run: |
          set -euo pipefail
          npm ci --strict-peer-deps --strict-allow-scripts 2>&1 | tee npm-install.log
          if grep -Ei 'npm warn|DeprecationWarning|\[DEP[0-9]+\]' npm-install.log; then
            echo "Dependency installation emitted warnings."
            exit 1
          fi
          npm ls --all >/dev/null
          npm audit --audit-level=low

      - name: Generate native icons
        run: npm run icons

      - name: Validate frontend
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run build 2>&1 | tee frontend-build.log
          if grep -Ei '(^|[[:space:]])warning:|\[warn\]|DeprecationWarning|\(!\)' frontend-build.log; then
            echo "Frontend build emitted warnings."
            exit 1
          fi

      - name: Prepare Windows native dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Install-WithRetry([string] $Package) {
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              choco install $Package -y --no-progress
              if ($LASTEXITCODE -eq 0) { return }
              if ($attempt -lt 3) {
                Write-Host "Retrying $Package after package source failure ($attempt/3)."
                Start-Sleep -Seconds (10 * $attempt)
              }
            }
            throw "Unable to install $Package after three attempts."
          }
          $perl = 'C:\Strawberry\perl\bin\perl.exe'
          if (-not (Test-Path -LiteralPath $perl -PathType Leaf)) {
            Install-WithRetry 'strawberryperl'
          }
          if (-not (Test-Path -LiteralPath $perl -PathType Leaf)) {
            throw 'Native Strawberry Perl executable missing.'
          }
          & $perl -MLocale::Maketext::Simple -MIPC::Cmd -e 'print "Native Perl ready\n"'
          if ($LASTEXITCODE -ne 0) { throw 'Native Perl prerequisites missing.' }

          # Prefer tools already available on the runner; avoid unnecessary feed requests.
          $env:PATH = "$env:PATH;" + [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          $nasm = Get-Command nasm.exe -CommandType Application -ErrorAction SilentlyContinue
          if (-not $nasm) {
            Install-WithRetry 'nasm'
            $env:PATH = "$env:PATH;" + [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
            $nasm = Get-Command nasm.exe -CommandType Application -ErrorAction SilentlyContinue
          }
          if (-not $nasm) { throw 'NASM executable missing after installation.' }
          & $nasm.Source -v
          if ($LASTEXITCODE -ne 0) { throw 'NASM version check failed.' }
          @('C:\Strawberry\perl\bin', 'C:\Strawberry\c\bin', (Split-Path -Parent $nasm.Source)) |
            Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Prepare locked OpenSSL for MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PATH = "C:\Strawberry\perl\bin;C:\Strawberry\c\bin;$env:PATH"
          ./src-tauri/scripts/prepare-msvc-openssl.ps1
          "CARGO_HOME=$env:CARGO_HOME" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Validate Rust
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Build installers into a draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Seven Mail v__VERSION__"
          releaseBody: |
            Seven Mail v__VERSION__

            Principais mudanças:
            - Proteção dos anexos temporários com ACLs Windows e permissões Unix.
            - Limpeza de caches legados e exportações temporárias expiradas.
            - Arraste de anexos com arquivos temporários únicos e prévia nativa.
            - Correções de segurança, armazenamento, sincronização e testes de protocolos.
            - CI obrigatório de SMTP, IMAP e POP3 com servidor isolado.

            Novidades da v1.0.3:
            - Configurações responsivas e seção Sobre com versão instalada e verificação de atualizações.
            - SMTP sem TLS explícito para relays locais confiáveis (localhost e IPs privados), sem desativar TLS de IMAP/POP3.
            - Logos dos provedores armazenadas localmente, com seletor de contas aprimorado.
            - Janelas de edição do calendário, contatos, tarefas, notas e regras com rolagem interna e ações acessíveis.
            - Verificação de atualizações a cada 30 minutos e ao reconectar; instalação silenciosa opcional ao sair (Windows NSIS).

            A homologação externa do Gmail, do arraste gráfico, das notificações nativas e das alterações visuais ainda requer validação específica.

            Windows:
            - MSI
            - NSIS (.exe)

            Linux:
            - DEB
            - AppImage

            macOS:
            - APP
            - DMG
          releaseDraft: true
          prerelease: false
          args: --bundles ${{ matrix.bundles }}
