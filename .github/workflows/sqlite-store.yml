name: Encrypted SQLite foundation

on:
  pull_request:
    paths:
      - 'src-tauri/sqlite-store/**'
      - 'src-tauri/storage_guard.rs'
      - '.github/workflows/sqlite-store.yml'
  push:
    branches: [main]
    paths:
      - 'src-tauri/sqlite-store/**'
      - 'src-tauri/storage_guard.rs'
      - '.github/workflows/sqlite-store.yml'

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri/sqlite-store
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve canonical lockfile
        shell: bash
        run: |
          cargo metadata --locked --all-features --format-version 1 > /dev/null
      - uses: actions/upload-artifact@v6
        with:
          name: sqlite-store-canonical-lock
          path: src-tauri/sqlite-store/Cargo.lock
          if-no-files-found: error

  sqlcipher:
    needs: lockfile
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: '-D warnings'
    defaults:
      run:
        working-directory: src-tauri/sqlite-store
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v7
        with:
          name: sqlite-store-canonical-lock
          path: src-tauri/sqlite-store
      - name: Install Windows OpenSSL build prerequisites
        if: runner.os == 'Windows'
        run: choco install strawberryperl nasm -y --no-progress
      - run: cargo test --locked --all-features
      - run: cargo check --locked --all-features
