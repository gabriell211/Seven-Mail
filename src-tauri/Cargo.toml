[package]
name = "seven-mail"
version = "0.1.0"
description = "Seven Mail desktop client"
authors = ["gabriell211"]
edition = "2021"

[lib]
name = "seven_mail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
keyring = "3"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "rustls", "ring", "webpki-roots"] }
async-imap = "0.11.3"
async-native-tls = "0.6.0"
async-std = "1.13.2"
futures = "0.3.31"
mail-parser = "0.11.9"
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
